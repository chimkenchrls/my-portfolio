<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" fill="none">
  <rect width="500" height="280" rx="12" fill="#0B132B"/>
  <rect x="2" y="2" width="496" height="276" rx="10" stroke="#1E293B" stroke-width="2"/>

  <!-- Monitoring Dashboard Mockup -->
  <!-- Top Stats Bar -->
  <g transform="translate(30, 60)">
    <rect width="135" height="50" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Cluster CPU Load</text>
    <text x="12" y="40" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">24.2%</text>

    <rect x="150" width="135" height="50" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="162" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Avg Latency (p99)</text>
    <text x="162" y="40" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">18.4ms</text>

    <rect x="300" width="140" height="50" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="312" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Uptime SLA</text>
    <text x="312" y="40" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">99.98%</text>
  </g>

  <!-- Metric Charts Grid -->
  <g transform="translate(30, 125)">
    <!-- Chart 1: Prometheus Metrics -->
    <rect width="215" height="125" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">Prometheus Request Rate</text>
    <!-- Wave line -->
    <path d="M15 90 Q 50 40, 80 70 T 140 50 T 200 60" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <path d="M15 90 Q 50 40, 80 70 T 140 50 T 200 60 L200 110 L15 110 Z" fill="#F59E0B" fill-opacity="0.1"/>

    <!-- Chart 2: Grafana Loki Logs & Alertmanager -->
    <rect x="225" width="215" height="125" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="240" y="22" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">Alertmanager Status</text>
    <rect x="240" y="38" width="185" height="24" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <text x="250" y="54" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">● HTTP 5xx Rate: 0.00% [NORMAL]</text>
    <rect x="240" y="70" width="185" height="24" rx="4" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <text x="250" y="86" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">● Disk I/O Threshold: OK (12%)</text>
  </g>

  <!-- Observability Header Pill -->
  <g transform="translate(30, 22)">
    <rect width="210" height="26" rx="6" fill="#1E293B"/>
    <text x="105" y="18" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Prometheus & Grafana Stack</text>
  </g>
</svg>
