<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" fill="none">
  <rect width="500" height="280" rx="12" fill="#0B132B"/>
  <rect x="2" y="2" width="496" height="276" rx="10" stroke="#1E293B" stroke-width="2"/>

  <!-- AWS VPC Cloud Boundary -->
  <rect x="25" y="65" width="450" height="195" rx="10" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6 3" fill="#1E293B" fill-opacity="0.3"/>
  <text x="45" y="88" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">AWS Cloud: VPC (10.0.0.0/16)</text>

  <!-- Public Subnet / ALB -->
  <rect x="45" y="105" width="180" height="135" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="60" y="125" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Public Subnet (Multi-AZ)</text>
  <rect x="65" y="140" width="140" height="35" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="135" y="162" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">App Load Balancer</text>
  <rect x="65" y="185" width="140" height="40" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="135" y="209" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">NAT Gateway</text>

  <!-- Private Subnet / AutoScaling -->
  <rect x="275" y="105" width="180" height="135" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="290" y="125" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Private Subnet (EKS / EC2)</text>
  <rect x="295" y="140" width="140" height="35" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="365" y="162" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Auto-Scaling Nodes</text>
  <rect x="295" y="185" width="140" height="40" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="365" y="209" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">RDS Multi-AZ Postgres</text>

  <!-- Connective Arrow -->
  <path d="M225 157 L275 157" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="275,153 283,157 275,161" fill="#38BDF8"/>

  <!-- Terraform Header Pill -->
  <g transform="translate(25, 25)">
    <rect width="180" height="26" rx="6" fill="#1E293B"/>
    <text x="90" y="18" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Terraform IaC Architecture</text>
  </g>
</svg>
