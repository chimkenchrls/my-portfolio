<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" fill="none">
  <rect width="500" height="280" rx="12" fill="#0B132B"/>
  <rect x="2" y="2" width="496" height="276" rx="10" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Flow Diagram Elements -->
  <!-- GitHub -->
  <rect x="30" y="90" width="90" height="100" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="75" cy="130" r="18" fill="#3B82F6" fill-opacity="0.2"/>
  <text x="75" y="135" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">Git</text>
  <text x="75" y="170" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">GitHub Actions</text>

  <!-- Arrow 1 -->
  <path d="M120 140 L160 140" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 2"/>
  <polygon points="160,136 168,140 160,144" fill="#38BDF8"/>

  <!-- Docker / Registry -->
  <rect x="170" y="90" width="90" height="100" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
  <rect x="195" y="115" width="40" height="30" rx="4" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="215" y="170" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Docker Hub</text>

  <!-- Arrow 2 -->
  <path d="M260 140 L300 140" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 2"/>
  <polygon points="300,136 308,140 300,144" fill="#38BDF8"/>

  <!-- ArgoCD / GitOps -->
  <rect x="310" y="90" width="90" height="100" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="355" cy="130" r="18" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="355" y="135" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">ArgoCD</text>
  <text x="355" y="170" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">GitOps Sync</text>

  <!-- Arrow 3 -->
  <path d="M400 140 L430 140" stroke="#10B981" stroke-width="3"/>
  <polygon points="430,136 438,140 430,144" fill="#10B981"/>

  <!-- Kubernetes Cluster -->
  <rect x="440" y="70" width="45" height="140" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="462" y="135" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 462 135)">K8s Cluster</text>

  <!-- Badges Top -->
  <g transform="translate(30, 30)">
    <rect width="180" height="26" rx="6" fill="#1E293B"/>
    <text x="90" y="18" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">CI/CD & GitOps Pipeline</text>
  </g>
</svg>
