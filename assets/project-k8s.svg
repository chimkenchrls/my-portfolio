<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" fill="none">
  <rect width="500" height="280" rx="12" fill="#0B132B"/>
  <rect x="2" y="2" width="496" height="276" rx="10" stroke="#1E293B" stroke-width="2"/>

  <!-- Ingress / NGINX Router -->
  <rect x="30" y="95" width="110" height="90" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="85" y="130" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">NGINX</text>
  <text x="85" y="150" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Reverse Proxy</text>

  <!-- Blue Deployment (Active) -->
  <rect x="220" y="65" width="230" height="70" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="240" cy="90" r="6" fill="#3B82F6"/>
  <text x="255" y="94" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">BLUE (Active - 100% Traffic)</text>
  <text x="255" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">v1.2.0 • 3 Pods healthy • Live Probes OK</text>

  <!-- Green Deployment (Staging / Cutover) -->
  <rect x="220" y="155" width="230" height="70" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="240" cy="180" r="6" fill="#10B981"/>
  <text x="255" y="184" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">GREEN (Ready - 0% Cutover)</text>
  <text x="255" y="208" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">v1.3.0 • Warm cache • Readiness 200 OK</text>

  <!-- Traffic switch arrow -->
  <path d="M140 130 Q 180 100, 215 100" stroke="#3B82F6" stroke-width="3"/>
  <polygon points="215,96 223,100 215,104" fill="#3B82F6"/>

  <path d="M140 150 Q 180 190, 215 190" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="215,186 223,190 215,194" fill="#10B981"/>

  <!-- Blue/Green Header Pill -->
  <g transform="translate(30, 25)">
    <rect width="240" height="26" rx="6" fill="#1E293B"/>
    <text x="120" y="18" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Zero-Downtime Blue/Green Deploy</text>
  </g>
</svg>
