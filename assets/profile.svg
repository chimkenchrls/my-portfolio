<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Outer circle & background -->
  <circle cx="200" cy="200" r="190" fill="url(#bg-glow)"/>
  <circle cx="200" cy="200" r="185" stroke="url(#primary-grad)" stroke-width="3" stroke-dasharray="12 6" opacity="0.6"/>

  <!-- DevOps Ring Elements -->
  <circle cx="200" cy="200" r="160" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8"/>
  
  <!-- Cloud & Server nodes floating -->
  <g opacity="0.7">
    <circle cx="70" cy="140" r="16" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <path d="M63 140 h14 M70 133 v14" stroke="#3B82F6" stroke-width="1.5"/>
    
    <circle cx="330" cy="140" r="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect x="323" y="133" width="14" height="14" rx="2" stroke="#10B981" stroke-width="1.5"/>
    
    <circle cx="90" cy="280" r="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="310" cy="280" r="14" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  </g>

  <!-- Avatar Silhouette / Stylized Character -->
  <g id="character">
    <!-- Body / Jacket -->
    <path d="M120 350 C120 290, 150 260, 200 260 C250 260, 280 290, 280 350 Z" fill="#1E293B"/>
    <!-- Collar / Hoodie line -->
    <path d="M160 265 L200 310 L240 265" stroke="url(#primary-grad)" stroke-width="3" fill="none"/>
    <path d="M185 270 L200 350 L215 270" stroke="#334155" stroke-width="2" fill="none"/>
    
    <!-- Neck -->
    <rect x="180" y="210" width="40" height="60" rx="8" fill="#E2E8F0"/>
    
    <!-- Head -->
    <ellipse cx="200" cy="170" rx="55" ry="65" fill="#F8FAFC"/>
    
    <!-- Modern Tech Hair -->
    <path d="M145 160 C140 115, 175 90, 215 95 C245 98, 260 120, 255 160 C245 130, 225 125, 200 125 C175 125, 155 135, 145 160 Z" fill="#0F172A"/>
    
    <!-- Glasses -->
    <rect x="160" y="155" width="32" height="22" rx="6" stroke="#0F172A" stroke-width="3" fill="#3B82F6" fill-opacity="0.1"/>
    <rect x="208" y="155" width="32" height="22" rx="6" stroke="#0F172A" stroke-width="3" fill="#3B82F6" fill-opacity="0.1"/>
    <path d="M192 165 h16" stroke="#0F172A" stroke-width="3"/>
    
    <!-- Smile -->
    <path d="M185 205 Q200 218 215 205" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Terminal Prompt Badge -->
  <g transform="translate(130, 325)">
    <rect width="140" height="34" rx="17" fill="#0F172A" stroke="url(#accent-grad)" stroke-width="2"/>
    <text x="70" y="22" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">kv@devops:~$</text>
  </g>
</svg>
